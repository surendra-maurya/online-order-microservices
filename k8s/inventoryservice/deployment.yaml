apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventoryservice
  namespace: online-order
  labels: { app.kubernetes.io/name: inventoryservice, app.kubernetes.io/part-of: online-order-system }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: inventoryservice } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: inventoryservice, app.kubernetes.io/part-of: online-order-system }
    spec:
      containers:
        - name: inventoryservice
          image: online-order-inventoryservice:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 80 }]
          env:
            - name: ASPNETCORE_URLS
              value: http://+:80

            - name: RabbitMQ__Host
              valueFrom:
                configMapKeyRef:
                  name: online-order-config
                  key: RABBITMQ_HOST

            - name: RabbitMQ__Port
              valueFrom:
                configMapKeyRef:
                  name: online-order-config
                  key: RABBITMQ_PORT

            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: online-order-secrets
                  key: rabbitmq-username

            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: online-order-secrets
                  key: rabbitmq-password

            - name: SQL_SERVER
              valueFrom:
                configMapKeyRef:
                  name: online-order-config
                  key: SQL_SERVER

            - name: SQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: online-order-config
                  key: SQL_PORT

            - name: SQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: online-order-secrets
                  key: sql-sa-password

            - name: ConnectionStrings__InventoryDb
              value: Server=$(SQL_SERVER),$(SQL_PORT);Database=InventoryDB;User Id=sa;Password=$(SQL_SA_PASSWORD);TrustServerCertificate=True

          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }

          startupProbe: { httpGet: { path: /health, port: http }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 20 }
