apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
  namespace: online-order
  labels: { app.kubernetes.io/name: authservice, app.kubernetes.io/part-of: online-order-system }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: authservice } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: authservice, app.kubernetes.io/part-of: online-order-system }
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authservice
          image: online-order-authservice:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 80 }]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: ASPNETCORE_URLS
              value: http://+:80
            - name: Jwt__Key
              valueFrom: { secretKeyRef: { name: online-order-secrets, key: jwt-key } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # AuthService currently has no /health endpoint, so TCP is the safe probe.
          startupProbe: { tcpSocket: { port: http }, timeoutSeconds: 5, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { tcpSocket: { port: http }, timeoutSeconds: 5, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: http }, timeoutSeconds: 5, initialDelaySeconds: 30, periodSeconds: 20 }
