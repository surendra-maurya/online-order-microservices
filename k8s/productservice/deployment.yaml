apiVersion: apps/v1
kind: Deployment

metadata:
  name: productservice
  namespace: online-order
  labels: { app.kubernetes.io/name: productservice, app.kubernetes.io/part-of: online-order-system }

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: productservice

  template:
    metadata:
      labels: { app.kubernetes.io/name: productservice, app.kubernetes.io/part-of: online-order-system }

    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: productservice
          image: online-order-productservice:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 80 }]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          env:
            - name: ASPNETCORE_URLS
              value: http://+:80

            - name: SQL_SERVER
              valueFrom:
                configMapKeyRef:
                  name: online-order-config
                  key: SQL_SERVER

            - name: SQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: online-order-config
                  key: SQL_PORT

            - name: SQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: online-order-secrets
                  key: sql-sa-password

            - name: ConnectionStrings__ProductDb
              value: Server=$(SQL_SERVER),$(SQL_PORT);Database=ProductDB;User Id=sa;Password=$(SQL_SA_PASSWORD);TrustServerCertificate=True

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 20
