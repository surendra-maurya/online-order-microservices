apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: online-order
  labels:
    app.kubernetes.io/name: sqlserver
    app.kubernetes.io/part-of: online-order-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sqlserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sqlserver
        app.kubernetes.io/part-of: online-order-system
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: sql
              containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: online-order-secrets
                  key: sql-sa-password
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: sql
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: sql
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: sql
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sqlserver-data
