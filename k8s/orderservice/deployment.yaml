apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice
  namespace: online-order
  labels: { app.kubernetes.io/name: orderservice, app.kubernetes.io/part-of: online-order-system }

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: orderservice

  template:
    metadata:
      labels: { app.kubernetes.io/name: orderservice, app.kubernetes.io/part-of: online-order-system }

    spec:
      containers:
        - name: orderservice
          image: online-order-orderservice:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 80 }]

          env:
            - name: ASPNETCORE_URLS
              value: http://+:80

            - name: SQL_SERVER
              valueFrom:
                configMapKeyRef:
                  name: online-order-config
                  key: SQL_SERVER

            - name: SQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: online-order-config
                  key: SQL_PORT

            - name: SQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: online-order-secrets
                  key: sql-sa-password

            - name: ConnectionStrings__OrderDb
              value: Server=$(SQL_SERVER),$(SQL_PORT);Database=OrderDB;User Id=sa;Password=$(SQL_SA_PASSWORD);TrustServerCertificate=True

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
